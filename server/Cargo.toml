[package]
name = "navault-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
description = "Loopback health listener for neo-air-vault. It does not store secrets."

[[bin]]
name = "navault-server"
path = "src/main.rs"

[features]
embed-ui = ["dep:include_dir"]

[dependencies]
axum = "0.8.9"
getrandom = "0.3"
include_dir = { version = "0.7.4", optional = true }
# The auth store and its routes. The store opens SQLite through `neotales-dbapi`;
# this crate does not keep a second pool.
neotales-dbapi = "=0.0.0-alpha.0"
neotales-x-auth = { path = "../auth/auth" }
neotales-x-auth-axum = { path = "../auth/axum" }
neotales-x-auth-core = { path = "../auth/core" }
neotales-x-auth-store-sqlite = { path = "../auth/store-sqlite" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread"] }
zeroize.workspace = true

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.24"
tower = { version = "0.5.3", features = ["util"] }

[lints]
workspace = true
